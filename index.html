<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8558A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DreamNote">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>DreamNote</title>
</head>
<body>
  <main class="app-shell">
    <section id="today-screen" class="screen active" aria-labelledby="app-title">
      <header class="top-header">
        <h1 id="app-title">DreamNote</h1>
      </header>

      <div class="date-row">
        <p id="today-date" class="today-date"></p>
        <div class="sleep-times">
          <label>
            <span>잠든 시각</span>
            <input id="sleepStart" type="time" inputmode="none">
          </label>
          <span class="sleep-sep">~</span>
          <label>
            <span>깬 시각</span>
            <input id="sleepEnd" type="time" inputmode="none">
          </label>
        </div>
        <p id="sleep-duration" class="sleep-duration"></p>
      </div>

      <section class="dream-area">
        <label for="dreamText" class="dream-label">오늘 꾼 꿈</label>
        <textarea id="dreamText" class="dream-text" placeholder="기억나는 만큼 적어보세요..."></textarea>
        <p id="save-indicator" class="save-indicator" aria-live="polite"></p>
      </section>
    </section>

    <section id="calendar-screen" class="screen" aria-labelledby="calendar-title" hidden>
      <header class="calendar-header">
        <h2 id="calendar-title">달력</h2>
      </header>
      <div class="month-nav">
        <button id="prev-month" type="button" aria-label="이전 달">이전</button>
        <strong id="month-label"></strong>
        <button id="next-month" type="button" aria-label="다음 달">다음</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendar-grid" class="calendar-grid" role="grid"></div>
      <div id="day-detail" class="day-detail" hidden></div>
    </section>
  </main>

  <nav class="tab-bar" aria-label="주요 메뉴">
    <button class="tab active" data-screen="today" type="button"><span class="tab-icon today-icon" aria-hidden="true"></span><span>오늘</span></button>
    <button class="tab" data-screen="calendar" type="button"><span class="tab-icon calendar-icon" aria-hidden="true"></span><span>달력</span></button>
  </nav>
  <script src="./app.js" defer></script>
</body>
</html>
